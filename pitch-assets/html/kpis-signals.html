<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    -webkit-font-smoothing: antialiased;
  }
  #kpis {
    display: inline-flex;
    gap: 16px;
    padding: 16px;
  }
  .stat-card {
    width: 200px;
    padding: 20px 24px;
    background: #ffffff;
    border: 1px solid #e2e4ea;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.04);
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
  }
  .stat-value {
    font-size: 36px;
    font-weight: 700;
    margin-top: 6px;
    line-height: 1;
  }
  .stat-destructive { color: #dc2626; }
  .stat-warning { color: #92400e; }
  .stat-muted { color: #6b7280; }
  .stat-success { color: #16a34a; }
</style>
</head>
<body>
<div id="kpis">
  <div class="stat-card">
    <p class="stat-label">Priorit&eacute; &eacute;lev&eacute;e</p>
    <p class="stat-value stat-destructive">3</p>
  </div>
  <div class="stat-card">
    <p class="stat-label">Priorit&eacute; moyenne</p>
    <p class="stat-value stat-warning">4</p>
  </div>
  <div class="stat-card">
    <p class="stat-label">En attente</p>
    <p class="stat-value stat-muted">5</p>
  </div>
  <div class="stat-card">
    <p class="stat-label">D&eacute;cid&eacute;s</p>
    <p class="stat-value stat-success">4</p>
  </div>
</div>
</body>
</html>
